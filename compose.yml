services:
  dnsserver:
    build: docker/dnsserver
    hostname: dnsserver
    networks: 
      rededns:
        ipv4_address: 192.168.130.9    
  kea:
    build: ./docker/kea
    container_name: kea
    networks:
      dhcp_lab:
        ipv4_address: 192.168.130.2
    volumes:
      - ./dhcp/kea-dhcp4.conf.json:/etc/kea/kea-dhcp4.conf
  

  
  cliente1:
    build: ./docker/cliente
    container_name: client1
    networks:
      dhcp_lab:
        ipv4_address: 192.168.130.3
        mac_address: 02:42:ac:11:00:10  # dirección HW fija

    command: >
      sh -c "dhclient -v eth0 && sleep infinity"

  cliente2:
    build: ./docker/cliente

    networks:
      dhcp_lab:
        ipv4_address: 192.168.130.4

    command: >
      sh -c "dhclient -v eth0 && sleep infinity"

networks:
  dhcp_lab:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.130.0/24

  rededns:
    ipam:
      config:
        - subnet: 192.168.100.0/24