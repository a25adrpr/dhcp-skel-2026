services:

  router:
    build: ./docker/router
    hostname: router
    networks:
      rede_wan:
        ipv4_address: 192.168.200.254
        interface_name: eth0  
      rede_stark:
        ipv4_address: 192.168.10.254
        interface_name: eth1
      rede2:
        ipv4_address: 192.168.140.254
        interface_name: eth2
    cap_add:
      - NET_ADMIN    
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.rp_filter=0
      - net.ipv4.conf.default.rp_filter=0      
  dnsserver:
    build: docker/dnsserver
    hostname: arya
    networks: 
      rede_stark:
        ipv4_address: 192.168.10.9  
    volumes:
      - ./arya/named.conf.local:/etc/bind/named.conf.local
      - ./arya/zonas:/var/cache/bind/zonas          
  ned:
    build: ./docker/kea
    container_name: ned
    networks:
      rede_stark:
        ipv4_address: 192.168.10.11
    volumes:
      - ./ned/kea-dhcp4.conf.json:/etc/kea/kea-dhcp4.conf
  

  
  cliente1:
    build: ./docker/cliente
    container_name: client1
    networks:
      rede_stark:
        ipv4_address: 192.168.10.221
        mac_address: 02:42:ac:11:00:10  # dirección HW fija

    command: >
      sh -c "ip addr flush dev eth0 && dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN
    depends_on:
      - ned
      - cliente2
  cliente2:
    build: ./docker/cliente

    networks:
      rede_stark:
        ipv4_address: 192.168.10.222

    command: >
      sh -c "ip addr flush dev eth0 && dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN
    depends_on:
      - ned

networks:
  rede_stark:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
  rede2:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.140.0/24

  rede_wan:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24             
